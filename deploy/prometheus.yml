# Prometheus scrapes the collector, never the worker: the worker pushes OTLP
# and stays scrape-free, which keeps short-lived or containerised workers
# observable without service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tollgate-otlp
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
