# Local observability stack for the tollgate worker: OTLP in, Prometheus and
# Grafana out. Everything is provisioned as code — no click-ops, no dashboards
# that live only on someone's laptop.
#
#   docker compose -f deploy/docker-compose.observability.yml up -d
#
# The worker needs no configuration to use it: its default OTLP endpoint is
# http://localhost:4318 (override with OTEL_EXPORTER_OTLP_ENDPOINT).
name: tollgate-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: tollgate-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP — the worker's default endpoint
      - "8889:8889" # Prometheus exposition of received metrics
      - "8888:8888" # the collector's own internal metrics
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: tollgate-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:13.0.6
    container_name: tollgate-grafana
    environment:
      # Local-only stack: anonymous admin keeps the demo one command long.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
